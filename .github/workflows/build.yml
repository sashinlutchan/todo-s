name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (test + Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/todo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
          cache: maven
          cache-dependency-path: backend/todo/pom.xml

      - name: Run tests
        run: chmod +x mvnw && ./mvnw test --batch-mode --no-transfer-progress

      - name: Build Docker image
        run: docker build -t todo-backend:ci .

  frontend:
    name: Frontend (KMP Android build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend/TO-DO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:testAndroidHostTest \
            :shared:compileAndroidMain \
            :androidApp:assembleDebug \
            -Pkotlin.native.ignoreDisabledTargets=true \
            --no-daemon
