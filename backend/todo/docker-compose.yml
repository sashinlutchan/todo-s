services:

  todo-db:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  tempo:
    image: grafana/tempo:2.7.2
    command: -config.file=/etc/tempo/tempo-config.yaml
    ports:
      - "3200:3200"   # Tempo HTTP (Grafana queries here)
    volumes:
      - ../observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  alloy:
    image: grafana/alloy:v1.9.2
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "4317:4317"   # OTLP gRPC  <- backend sends all signals here
      - "4318:4318"   # OTLP HTTP  (optional)
      - "12345:12345" # Alloy UI
    volumes:
      - ../observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.2
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  todo-backend:
    build: .
    ports: ["8080:8080"]
    depends_on:
      todo-db:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@todo-db:27017/taskflow?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      RESET_TOKEN_EXPIRATION_MS: ${RESET_TOKEN_EXPIRATION_MS}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY}
      INFOBIP_SMS_SENDER: ${INFOBIP_SMS_SENDER}
      PASSWORD_RESET_CODE_TTL_MINUTES: ${PASSWORD_RESET_CODE_TTL_MINUTES}
      # OpenTelemetry -> Alloy -> Loki/Tempo/Prometheus
      # All three signals are exported; Alloy fans them out to the right backend.
      OTEL_SERVICE_NAME: todo-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${OTEL_ENVIRONMENT:-local}

volumes:
  mongo_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
