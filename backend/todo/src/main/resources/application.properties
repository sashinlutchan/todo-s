spring.application.name=todo

spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/taskflow}
spring.data.mongodb.auto-index-creation=true

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:dev-only-placeholder-at-least-256-bits-of-random-data-needed-here-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.reset-token-expiration-ms=${RESET_TOKEN_EXPIRATION_MS:300000}

app.infobip.base-url=${INFOBIP_BASE_URL:https://api.infobip.com}
app.infobip.api-key=${INFOBIP_API_KEY:}
app.infobip.sms-sender=${INFOBIP_SMS_SENDER:447491163443}

app.password-reset.code-ttl-minutes=${PASSWORD_RESET_CODE_TTL_MINUTES:15}

spring.jackson.deserialization.fail-on-null-for-primitives=false
